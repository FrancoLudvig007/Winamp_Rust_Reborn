[package]
name = "winamp-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rodio = { version = "0.19", default-features = false, features = ["mp3", "wav"] }
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
rfd = "0.15"

# Binário o menor possível: cargo build --release
[profile.release]
opt-level = "z"      # otimiza tamanho
lto = "fat"          # otimização entre crates
codegen-units = 1    # melhor otimização/tamanho
panic = "abort"      # remove código de unwinding
strip = true         # remove símbolos de debug